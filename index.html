<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>相続税シミュレーション</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 5段階のウィザード。上部に進捗、中央に入力カード、相続人ページは右側に関係図 */
:root{
  --bg:#e8f4ea; --surface:#fbfefb; --soft:#d9eedd; --ink:#1b2e22; --muted:#506b5a; --line:#c4dccb;
  --primary:#2e7a4c; --on-primary:#ffffff; --primary-ink:#23633d; --accent:#a8792a; --accent-soft:#f5efdc;
  --ok:#23633d; --ok-soft:#d6efdc; --warn:#9c4a22; --warn-soft:#f8e9e0; --dead:#869a8c;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1912; --surface:#16231a; --soft:#1d3023; --ink:#e3efe6; --muted:#9db5a5; --line:#2a4031;
  --primary:#3d9463; --on-primary:#ffffff; --primary-ink:#8fd3a8; --accent:#d8ad62; --accent-soft:#2e2717;
  --ok:#8fd3a8; --ok-soft:#173026; --warn:#eb9a70; --warn-soft:#352016; --dead:#73877a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1912; --surface:#16231a; --soft:#1d3023; --ink:#e3efe6; --muted:#9db5a5; --line:#2a4031;
  --primary:#3d9463; --on-primary:#ffffff; --primary-ink:#8fd3a8; --accent:#d8ad62; --accent-soft:#2e2717;
  --ok:#8fd3a8; --ok-soft:#173026; --warn:#eb9a70; --warn-soft:#352016; --dead:#73877a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}

/* header & stepper */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--primary-ink);letter-spacing:.06em}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0;counter-reset:s}
.steps li{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);padding-top:10px;border-top:4px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.done{border-color:var(--primary);color:var(--primary-ink)}
.steps li.now{border-color:var(--accent);color:var(--ink);font-weight:700}
.steps b{font-weight:700;margin-right:4px}
@media (max-width:560px){.steps li span{display:none}}

h1,h2,h3{text-wrap:balance;line-height:1.35}
h2.pg{font-size:24px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* nav buttons */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 30px;font-weight:700;font-size:17px;cursor:pointer;min-height:52px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--accent);color:#fff}
.nav .spacer{flex:1}
.err{color:var(--warn);font-size:14px;font-weight:500;margin-top:10px}

/* page 1 */
.hero{display:grid;place-items:center;text-align:center;padding-block:40px 20px}
.kamon{width:64px;height:64px;margin-bottom:14px}
.ie{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,48px);display:flex;align-items:baseline;justify-content:center;gap:.2em;flex-wrap:wrap;letter-spacing:.04em}
.ie input{font-family:var(--f-display);font-weight:700;font-size:inherit;width:4.6em;text-align:center;border:0;border-bottom:3px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:2px 6px;color:var(--ink)}
.ie input::placeholder{color:var(--muted);opacity:.55}
.ie .sim{display:block;width:100%;font-size:.62em;color:var(--primary-ink);margin-top:6px}
.hero p{max-width:34em;color:var(--muted);margin:22px auto 0}
.caution1{max-width:640px;margin:8px auto 0;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:20px 24px}
.caution1.agreed{border-color:var(--primary)}
.caution1 h2{margin:0 0 8px;font-size:18px;color:var(--warn)}
.caution1.agreed h2{color:var(--primary-ink)}
.caution1 ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.caution1 li{line-height:1.7}
.agree{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border-radius:8px;background:var(--accent-soft);cursor:pointer;font-weight:700;font-size:17px}
.caution1.agreed .agree{background:var(--ok-soft)}
.agree input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--primary);cursor:pointer}
.agree-hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.ie input:disabled{opacity:.45;cursor:not-allowed}
.unsup{max-width:640px;margin:14px auto 0;background:var(--soft);border-radius:var(--r);padding:16px 24px}
.unsup h2{margin:0 0 6px;font-size:16px;color:var(--ink)}
.unsup ul{margin:0;padding-left:1.3em;display:grid;gap:2px;font-size:15px}
.unsup p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px;max-width:760px;margin-inline:auto}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:14px;text-align:left}
.howto b{display:block;color:var(--primary-ink);font-size:13px}
@media (max-width:640px){.howto{grid-template-columns:1fr 1fr}}

/* page 2 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:20px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px}
@media (max-width:860px){.side{position:static}}
.q h3{font-size:18px;margin:0 0 4px}
.q .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 28px;font-weight:700;cursor:pointer;min-height:44px}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.sub{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row .lbl{min-width:0;flex:1 1 200px}
.row .lbl small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.ctr{display:inline-flex;align-items:center;gap:6px}
.ctr button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.ctr button:hover{border-color:var(--primary)}
.ctr output{min-width:2.2em;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.indent{margin-left:14px;padding-left:14px;border-left:3px solid var(--soft)}
.note{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:14px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.diagram{overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px}
.chip b{color:var(--primary-ink)}
details.names summary{cursor:pointer;color:var(--primary-ink);font-weight:500}
.namegrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin-top:12px}
.namegrid input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}

/* svg */
.n-box{fill:var(--surface);stroke:var(--primary);stroke-width:1.6}
.n-dec{fill:var(--primary);stroke:var(--primary)}
.n-dead{fill:var(--bg);stroke:var(--dead);stroke-dasharray:4 3;stroke-width:1.4}
.n-t{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-body)}
.n-s{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.n-dec-t{fill:var(--on-primary)}
.n-dead-t{fill:var(--dead)}
.ln{stroke:var(--muted);stroke-width:1.4;fill:none}

/* page 3 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer}
.tab b{display:block;font-size:16px}
.tab span{font-size:13px;color:var(--muted)}
.tab.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
@media (max-width:560px){.tabs{grid-template-columns:1fr}}
.grp h3{font-size:17px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.grp h3 .tag{font-size:12px;font-weight:500;border-radius:4px;padding:1px 8px;background:var(--soft);color:var(--primary-ink)}
.grp h3 .tag.minus{background:var(--warn-soft);color:var(--warn)}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld label b{display:block;font-weight:700}
.fld label small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
@media (max-width:560px){.fld{grid-template-columns:1fr}}
.yen{display:flex;align-items:center;border:2px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.yen:focus-within{border-color:var(--primary)}
.yen input{border:0;background:transparent;padding:10px 8px 10px 12px;text-align:right;width:100%;min-width:0;font-size:18px;font-variant-numeric:tabular-nums;outline:none}
.yen span{padding:0 12px 0 2px;color:var(--muted);font-size:14px;white-space:nowrap}
.calcbox{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px;display:grid;gap:2px;margin:0 0 6px}
.calcbox div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.calcbox .k{font-weight:700}
.gift .txt{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);min-height:48px}
.gift .txt:focus{border-color:var(--primary);outline:none}
@media (max-width:640px){.gift.ins{grid-template-columns:1fr 1fr}.gift.ins>div:first-child{grid-column:1/-1}}
.ins9{margin-top:14px}
.ins9-t{margin:0 0 6px;font-weight:700}
.report .ins9-t{font-size:15px;color:var(--primary-ink)}
.gift{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding-block:10px;border-bottom:1px dashed var(--line)}
.gift label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.gift select{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);min-height:48px}
.gift .del{border:0;background:none;color:var(--warn);cursor:pointer;padding:12px 6px;font-size:14px}
@media (max-width:640px){.gift{grid-template-columns:1fr 1fr}.gift .g-to{grid-column:1/-1}}
.addbtn{margin-top:10px;border:2px dashed var(--line);background:transparent;border-radius:8px;padding:10px 16px;cursor:pointer;color:var(--primary-ink);font-weight:700;width:100%}
.runbar{position:sticky;bottom:0;z-index:2;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(0,0,0,.06);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.runbar b{font-size:20px;color:var(--primary-ink)}
.drop{border:2px dashed var(--primary);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--soft)}
.drop input{display:none}
.drop .btn{margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th,.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t td.r,.t th.r{text-align:right;white-space:nowrap}
.t tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.t tr.minus td{color:var(--warn)}
.t th{font-size:13px;color:var(--muted);font-weight:500}
.tw{overflow-x:auto}

/* page 4 */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.big3 div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.big3 small{display:block;color:var(--muted);font-size:13px}
.big3 b{font-size:24px;color:var(--primary-ink);font-variant-numeric:tabular-nums}
@media (max-width:640px){.big3{grid-template-columns:1fr}}

/* page 5 */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,40px)}
.report h1{font-family:var(--f-display);font-size:clamp(24px,4.6vw,34px);text-align:center;margin:0;letter-spacing:.05em}
.report .date{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 22px}
.report h2{font-size:17px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary);color:var(--primary-ink)}
.verdict{border-radius:var(--r);padding:18px 20px;font-size:18px;font-weight:700}
.verdict.none{background:var(--ok-soft);color:var(--ok)}
.verdict.tax{background:var(--accent-soft)}
.taxlist{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.taxlist td{padding:9px 6px;border-bottom:1px dotted var(--line)}
.taxlist td.r{text-align:right;white-space:nowrap}
.taxlist td.amt{font-size:20px;font-weight:700}
.taxlist tr.sum td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.taxlist tr.sum td.amt{font-size:24px;color:var(--accent)}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;font-weight:500}
.caution{margin-top:26px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px}
.memo h2{border-bottom-color:var(--line)}
.memo textarea{width:100%;min-height:200px;border:0;resize:vertical;background-color:transparent;line-height:40px;padding:0 4px;font-size:15px;background-attachment:local;outline:none}
.memo textarea{background-image:linear-gradient(90deg,var(--surface) 50%,transparent 50%),repeating-linear-gradient(to bottom,transparent 0,transparent 38px,var(--muted) 38px,var(--muted) 39px,transparent 39px,transparent 40px);background-size:8px 100%,100% 40px}
.pct{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.pct:focus-within{border-color:var(--primary)}
.pct input{width:4.6em;border:0;background:transparent;text-align:right;padding:6px 2px 6px 6px;font-variant-numeric:tabular-nums;outline:none}
.pct span{padding:0 6px 0 1px;color:var(--muted);font-size:12px}
table.alloc td,table.alloc th{vertical-align:middle;white-space:nowrap}
.psum{font-weight:700}.psum.ok{color:var(--ok)}.psum.bad{color:var(--warn)}
.minibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--primary-ink)}
.minibtn:hover{border-color:var(--primary)}
.mapbox{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--soft)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 12px;align-items:center}
.mapgrid select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);min-height:42px}
@media (max-width:520px){.mapgrid{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary)}
.taxlist th{font-size:13px;color:var(--muted);font-weight:500;padding:6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:bottom}
.taxlist th.r{text-align:right}
.taxlist th.sp{color:var(--primary-ink);font-weight:700}
.taxlist td.amtc{white-space:nowrap}
.taxlist .amtc .amt{display:block;font-size:20px;font-weight:700}
.taxlist .amtc .yenv{display:block;font-size:12px;color:var(--muted);font-weight:400}
.taxlist td.sp{background:var(--ok-soft)}
.taxlist tr.sum .amtc .amt{font-size:24px;color:var(--accent)}
.taxlist tr.sum td.sp .amt{color:var(--ok)}
.taxlist .pricev{display:block;font-size:12px;color:var(--muted)}
.spnote{margin-top:12px;background:var(--ok-soft);border-radius:8px;padding:12px 16px;font-size:15px}
.spnote b{color:var(--ok)}
@media (max-width:520px){.taxlist .amtc .amt{font-size:16px}.taxlist tr.sum .amtc .amt{font-size:18px}}
.memo-lines{min-height:200px;white-space:pre-wrap;line-height:40px;padding:0 4px;font-size:15px;
  background-image:linear-gradient(90deg,var(--surface) 50%,transparent 50%),repeating-linear-gradient(to bottom,transparent 0,transparent 38px,var(--muted) 38px,var(--muted) 39px,transparent 39px,transparent 40px);background-size:8px 100%,100% 40px}
.pwbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pwbox input{flex:1 1 220px;min-width:0;border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:16px}
.pwbox input:focus{border-color:var(--primary);outline:none}
#printMsg{margin-top:12px}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;font-size:14px}
.foot dt{color:var(--muted)}
.foot dd{margin:0}
.foot .org{font-weight:700}
details.sup{margin-top:18px;background:var(--soft);border-radius:8px;padding:12px 16px}
details.sup summary{cursor:pointer;font-weight:500;color:var(--primary-ink)}
.supgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin-top:10px}
.supgrid input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.noprint{}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:13px}.report h1{font-size:24px}.report h2{margin:14px 0 6px;font-size:14px}.t th,.t td{padding:3px 6px;font-size:12px}.taxlist td{padding:4px 6px}.taxlist .amtc .amt{font-size:15px}.taxlist tr.sum .amtc .amt{font-size:18px}.verdict{padding:10px 14px;font-size:15px}.memo-lines,.memo textarea{min-height:120px}.caution{margin-top:12px}.foot{margin-top:12px}
  .report h2{break-after:avoid}.report .diagram,.taxlist,.verdict{break-inside:avoid}
  .top,.steps,.nav,.noprint,details.sup{display:none!important}
  .report{border:0;padding:0}
}
@media (prefers-reduced-motion:no-preference){.pagein{animation:fi .25s ease-out}}
/* manual */
.top{flex-wrap:nowrap;align-items:flex-start}

<script>
(function(){
"use strict";
/* ====== 定数 ====== */
const STORE_KEY='sozokuSim.v1', SUP_KEY='sozokuSim.support.v1';
const FW='ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺ';
const L=i=>FW[i%26]+(i>=26?String(Math.floor(i/26)+1):'');
const STEPS=['世帯名','相続人','財産','確認','結果'];
const ASSETS=[
  {k:'land',grp:'plus',t:'土地',h:'宅地・田畑・山林など。路線価または固定資産税評価額×倍率が目安'},
  {k:'building',grp:'plus',t:'建物（家屋・マンション）',h:'固定資産税評価額が目安。マンションは土地分も含めて可'},
  {k:'securities',grp:'plus',t:'有価証券',h:'株式・投資信託・国債・社債など'},
  {k:'cash',grp:'plus',t:'現金・預貯金',h:'普通預金・定期預金・手元の現金など'},
  {k:'household',grp:'plus',t:'家庭用財産・自動車',h:'家具・家電・貴金属・自動車など'},
  {k:'other',grp:'plus',t:'その他の財産',h:'貸付金・ゴルフ会員権・未収金など'},
  {k:'insurance',grp:'deem',t:'生命保険金（死亡保険金）',h:'亡くなった方が保険料を負担し、相続人が受け取る保険金'},
  {k:'retirement',grp:'deem',t:'死亡退職金',h:'勤務先から遺族に支払われる退職手当金・功労金など'},
  {k:'debt',grp:'minus',t:'債務',h:'借入金・未払いの税金や医療費など'},
  {k:'funeral',grp:'minus',t:'葬式費用',h:'通夜・告別式・火葬などの費用（香典返し・法要費用は除く）'}
];
const RATES=[[10e6,.10,0],[30e6,.15,50e4],[50e6,.20,200e4],[100e6,.30,700e4],[200e6,.40,1700e4],[300e6,.45,2700e4],[600e6,.50,4200e4],[Infinity,.55,7200e4]];

/* ====== 状態 ====== */
function blank(){return{page:0,family:'',spouse:null,
  children:{has:null,bio:1,adopted:0,dec:[]},
  parents:{has:null,count:2},
  siblings:{has:null,alive:1,dec:[]},
  names:{},assets:{},rekinen:[],seisan:[],inputMode:'direct',memo:'',alloc:{mode:'legal',r:{}},ins:[]};}
let S=blank(), SUP={company:'',address:'',contact:'',person:''};
try{const r=localStorage.getItem(STORE_KEY);if(r){S=Object.assign(blank(),JSON.parse(r));if(!S.alloc||!S.alloc.r)S.alloc={mode:'legal',r:{}};if(!Array.isArray(S.ins))S.ins=[];if(S.assets.insurance>0&&!S.ins.length){S.ins=[{co:'',to:'',amount:S.assets.insurance}];}delete S.assets.insurance;}}catch(e){}
try{const r=localStorage.getItem(SUP_KEY);if(r){SUP=Object.assign(SUP,JSON.parse(r));}}catch(e){}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(S));localStorage.setItem(SUP_KEY,JSON.stringify(SUP));}catch(e){}},200);}

/* ====== 金額ユーティリティ ====== */
const toYenFromMan=s=>{const t=String(s??'').normalize('NFKC').replace(/[,，\s]/g,'');if(!t)return 0;const v=parseFloat(t);return isFinite(v)&&v>0?Math.round(v*10000):0;};
const manStr=y=>y?(y/10000).toLocaleString('ja-JP',{maximumFractionDigits:4}):'';
const man=y=>{const v=y/10000;return (Math.round(v*10)/10).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万円';};
const yen=y=>Math.round(y).toLocaleString('ja-JP')+'円';
const fl=(v,u)=>Math.floor(v/u)*u;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(n,d)=>{const g=gcd(n,d);return (n/g)+'/'+(d/g);};
const insSum=()=>(S.ins||[]).reduce((t,r)=>t+(r.amount||0),0);
const A=k=>k==='insurance'?insSum():(S.assets[k]||0);

/* ====== 相続人モデル ======
 adoptLimit: true=相続税の総額計算用（養子の数を制限）, false=民法上の法定相続分 */
function model(adoptLimit){
  const P=[], dead=[]; let rank=0;
  const sp=S.spouse===true;
  const c=S.children, hasC=c.has===true;
  const decWith=hasC?c.dec.filter(n=>n>0).length:0;
  const realStocks=hasC?(c.bio+decWith):0;
  let adopted=hasC?c.adopted:0;
  if(adoptLimit) adopted=Math.min(adopted, realStocks>0?1:2);
  const r1=hasC&&(c.bio+c.adopted+decWith)>0;
  if(r1){
    rank=1;const stocks=realStocks+adopted, base=sp?2:1;
    let ci=0,gi=0;
    for(let i=0;i<c.bio;i++){P.push({id:'c'+i,label:'子'+L(ci++),rel:'子',n:1,d:base*stocks});}
    for(let i=0;i<(hasC?c.adopted:0);i++){const lab='子'+L(ci++);if(i<adopted)P.push({id:'a'+i,label:lab,rel:'子（養子）',n:1,d:base*stocks});}
    c.dec.forEach((reps,i)=>{const lab='子'+L(ci++);dead.push({id:'dc'+i,label:lab,reps});
      for(let j=0;j<reps;j++){P.push({id:'g'+i+'_'+j,label:'孫'+L(gi++),rel:'孫（'+lab+'の代襲相続人）',n:1,d:base*stocks*reps,parent:'dc'+i});}});
  }else if(S.parents.has===true&&S.parents.count>0){
    rank=2;const n=S.parents.count,base=sp?3:1;
    for(let i=0;i<n;i++)P.push({id:'p'+i,label:n===2?['父','母'][i]:'父または母',rel:'直系尊属',n:1,d:base*n});
  }else if(S.siblings.has===true&&(S.siblings.alive+S.siblings.dec.filter(n=>n>0).length)>0){
    rank=3;const sb=S.siblings,stocks=sb.alive+sb.dec.filter(n=>n>0).length,base=sp?4:1;let si=0,ni=0;
    for(let i=0;i<sb.alive;i++)P.push({id:'s'+i,label:'兄弟姉妹'+L(si++),rel:'兄弟姉妹',n:1,d:base*stocks,sur:true});
    sb.dec.forEach((reps,i)=>{const lab='兄弟姉妹'+L(si++);dead.push({id:'ds'+i,label:lab,reps});
      for(let j=0;j<reps;j++)P.push({id:'n'+i+'_'+j,label:'甥姪'+L(ni++),rel:'甥・姪（'+lab+'の代襲相続人）',n:1,d:base*stocks*reps,sur:true,parent:'ds'+i});});
  }
  if(sp){const sh=rank===1?[1,2]:rank===2?[2,3]:rank===3?[3,4]:[1,1];P.unshift({id:'sp',label:'配偶者',rel:'配偶者',n:sh[0],d:sh[1]});}
  const allAdopted=hasC?c.adopted:0, countedAdopted=Math.min(allAdopted,realStocks>0?1:2);
  return {rank,P,dead,count:P.length,allAdopted,countedAdopted};
}
const nm=p=>(S.names[p.id]||'').trim()||p.label;

/* ====== 財産の分け方（取得割合） ====== */
const ALLOC_KEYS=['land','building','securities','cash','household','other','retirement','debt','funeral']; /* 生命保険金は受取人ごとに入力（第9表）するため対象外 */
const ATITLE=k=>(ASSETS.find(a=>a.k===k)||{}).t||k;
const pctNum=v=>{const t=String(v??'').normalize('NFKC').replace(/[%％,\s]/g,'');if(t==='')return null;const n=parseFloat(t);return isFinite(n)&&n>=0?n:null;};
const fmtPct=v=>v==null?'':String(Math.round(v*100)/100);
/* 財産の種類 k について各相続人の取得割合（0〜1）を返す */
function rowShares(k,P){
  const legal=()=>{const m={};P.forEach(p=>m[p.id]=p.n/p.d);return m;};
  if(S.alloc.mode!=='custom'||P.length<2)return{f:legal(),status:'legal',sum:100};
  const r=S.alloc.r[k]||{};let sum=0;P.forEach(p=>{const v=r[p.id];if(v>0)sum+=v;});
  if(sum<=0)return{f:legal(),status:'blank',sum:0};
  const m={};P.forEach(p=>{const v=r[p.id];m[p.id]=v>0?v/sum:0;});
  return{f:m,status:Math.abs(sum-100)<0.05?'ok':'bad',sum};
}
function allocIssues(){const P=model(false).P;const out=[];
  if(S.alloc.mode!=='custom'||P.length<2)return out;
  ALLOC_KEYS.forEach(k=>{if(!A(k))return;const rs=rowShares(k,P);if(rs.status==='bad'||rs.status==='blank')out.push({k,status:rs.status,sum:rs.sum});});
  return out;}

/* ====== 計算 ====== */
function calc(){
  const civ=model(false), lim=model(true);
  const n=lim.count, limitIns=5e6*n;
  const ins=A('insurance'), ret=A('retirement');
  /* 生命保険金の課税金額（第9表 生命保険金などの明細書）
     Ⓐ 非課税限度額 = 500万円 × 法定相続人の数
     Ⓑ 相続人が受け取った保険金の合計
     ② 各人の非課税金額 = Ⓐ × 各人の① ÷ Ⓑ（Ⓑ≦Ⓐ のときは ① の全額）
     ③ 課税金額 = ① − ② */
  const ins9=(()=>{const rows=civ.P.map(p=>{const recv=(S.ins||[]).filter(r=>r.to===p.id).reduce((t,r)=>t+(r.amount||0),0);return{id:p.id,p,recv};}).filter(r=>r.recv>0);
    const B=rows.reduce((t,r)=>t+r.recv,0);
    rows.forEach(r=>{r.nontax=B<=limitIns?r.recv:Math.floor(limitIns*r.recv/B);r.tax=r.recv-r.nontax;});
    const unassigned=(S.ins||[]).filter(r=>!civ.P.some(p=>p.id===r.to)).reduce((t,r)=>t+(r.amount||0),0);
    return{A:limitIns,B,rows,nontax:rows.reduce((t,r)=>t+r.nontax,0),tax:rows.reduce((t,r)=>t+r.tax,0),unassigned};})();
  const insT=ins9.tax, retT=Math.max(0,ret-limitIns);
  const plusKeys=['land','building','securities','cash','household','other'];
  const plus=plusKeys.reduce((s,k)=>s+A(k),0);
  const debts=A('debt')+A('funeral');
  const ids=new Set(civ.P.map(p=>p.id));
  const sumG=(arr,f)=>arr.reduce((s,g)=>s+(g[f]||0),0);
  const rekinen=sumG(S.rekinen,'amount'), seisan=sumG(S.seisan,'amount');
  const gross=plus+insT+retT;
  const net=Math.max(0,gross+seisan-debts);
  // 各人の課税価格：取得割合（未入力は法定相続分）で財産・債務を配分し、各人の贈与加算額を加える
  const SH={};ALLOC_KEYS.forEach(k=>SH[k]=rowShares(k,civ.P));
  const amtOf=k=>k==='insurance'?insT:k==='retirement'?retT:A(k);
  const heirs=civ.P.map(p=>{
    const rk=S.rekinen.filter(g=>g.to===p.id), ss=S.seisan.filter(g=>g.to===p.id);
    let acq=0;plusKeys.concat(['retirement']).forEach(k=>acq+=amtOf(k)*(SH[k].f[p.id]||0));
    const insRow=ins9.rows.find(r=>r.id===p.id);const insTax=insRow?insRow.tax:0;acq+=insTax;
    const debt=A('debt')*(SH.debt.f[p.id]||0)+A('funeral')*(SH.funeral.f[p.id]||0);
    const rkAmt=sumG(rk,'amount'), ssAmt=sumG(ss,'amount');
    const price=fl(Math.max(0,acq+ssAmt-debt)+rkAmt,1000);
    return {...p,acq,insTax,debt,rkAmt,ssAmt,price,rkTax:sumG(rk,'tax'),ssTax:sumG(ss,'tax')};
  });
  const total=heirs.reduce((s,h)=>s+h.price,0);
  const basic=30e6+6e6*n;
  const kazei=Math.max(0,total-basic);
  // 相続税の総額（法定相続分で按分した金額に速算表）
  let sogaku=0; const slots=lim.P.map(p=>{const amt=fl(kazei*p.n/p.d,1000);const r=RATES.find(r=>amt<=r[0]);const tx=Math.max(0,amt*r[1]-r[2]);sogaku+=tx;return{...p,amt,rate:r[1],ded:r[2],tx};});
  sogaku=fl(sogaku,100);
  heirs.forEach(h=>{
    const r=total>0?h.price/total:0;
    h.ratio=r; h.calcTax=Math.floor(sogaku*r);
    h.surAmt=h.sur?Math.floor(h.calcTax*0.2):0;
    let t=h.calcTax+h.surAmt;
    h.rkUsed=Math.min(t,h.rkTax); t-=h.rkUsed;
    h.ssUsed=h.ssTax; t-=h.ssTax;
    h.pay=t>=0?fl(t,100):t; // マイナスは還付見込み
    h.red=0;
  });
  // 配偶者の税額軽減（第5表「1 一般の場合」）
  let sr=null;const sp=heirs.find(h=>h.id==='sp');
  if(sp&&total>0){
    const r1raw=total*sp.n/sp.d, r1=Math.max(r1raw,16e7);           // ① 法定相続分相当額（1億6千万円に満たないときは1億6千万円）
    const r2=sp.acq, r3=sp.debt, r5=r3, r6=sp.rkAmt;               // ② 分割財産 ③ 債務・葬式費用 ⑤ 控除額 ⑥ 暦年課税分の贈与財産
    const r7=fl(Math.max(0,r2-r5)+r6,1000);                        // ⑦ (②−⑤＋⑥) 1,000円未満切捨て
    const r8=sogaku, r9=Math.min(r1,r7), r10=total;                // ⑧ 相続税の総額 ⑨ ①と⑦の少ない方 ⑩ 課税価格の合計額
    const r11=Math.floor(r8*r9/r10);                               // ⑪ 税額軽減の基となる金額
    const lim2=Math.max(0,sp.calcTax+sp.surAmt-sp.rkUsed);         // ロ 限度額（算出税額−暦年課税分の贈与税額控除）
    const red=Math.min(r11,lim2);                                  // ハ 配偶者の税額軽減額
    sp.red=red;
    sr={r1raw,r1,r2,r3,r5,r6,r7,r8,r9,r10,r11,lim:lim2,red,share:frac(sp.n,sp.d)};
  }
  heirs.forEach(h=>{const t=h.calcTax+h.surAmt-h.rkUsed-h.red-h.ssUsed;h.payAfter=t>0?fl(t,100):0;});
  const pay=heirs.reduce((s,h)=>s+Math.max(0,h.pay),0);
  const payAfter=heirs.reduce((s,h)=>s+h.payAfter,0);
  const refund=heirs.reduce((s,h)=>s+Math.min(0,h.pay),0);
  return {civ,lim,n,limitIns,ins,ins9,ret,insT,retT,plus,debts,rekinen,seisan,gross,net,total,basic,kazei,slots,sogaku,heirs,pay,payAfter,refund,sr,needFile:total>basic,ids,custom:S.alloc.mode==='custom'&&civ.P.length>1,issues:allocIssues()};
}

/* ====== 関係図 ====== */
function diagram(){
  const m=model(false), W=108,H=48,GX=14,GY=40;
  const shares={};m.P.forEach(p=>shares[p.id]=frac(p.n,p.d));
  const nodes=[],lines=[];
  const box=(id,x,y,title,sub,kind)=>{nodes.push({id,x,y,title,sub,kind});return{x,y,cx:x+W/2,top:y,bot:y+H,mid:y+H/2,l:x,r:x+W};};
  const short=s=>s.length>7?s.slice(0,7)+'…':s;
  const heirBox=(p,x,y)=>{const own=(S.names[p.id]||'').trim();return box(p.id,x,y,short(own||p.label),(own?p.label+' ':'')+shares[p.id]+(p.sur?' 2割加算':''),'h');};
  const sp=m.P.find(p=>p.id==='sp');
  const row=i=>i*(H+GY);
  let D,SP;
  const couple=(cx,y)=>{ if(sp){D=box('dec',cx-W-GX/2,y,'被相続人','（亡くなった方）','d');SP=heirBox(sp,cx+GX/2,y);lines.push(`M${D.r} ${D.mid-3}H${SP.l}M${D.r} ${D.mid+3}H${SP.l}`);}
    else{D=box('dec',cx-W/2,y,'被相続人','（亡くなった方）','d');} };
  const coupleMidX=()=>sp?(D.r+SP.l)/2:D.cx;
  if(m.rank===1){
    const kids=m.P.filter(p=>p.id[0]==='c'||p.id[0]==='a');
    const cols=[...kids.map(p=>({p,w:1})),...m.dead.map(d=>({d,w:Math.max(1,d.reps)}))];
    let x=0;const y1=row(1),y2=row(2);const tops=[];
    cols.forEach(col=>{const cw=col.w*(W+GX);const cx=x+cw/2;
      if(col.p){const b=heirBox(col.p,cx-W/2,y1);tops.push(b.cx);}
      else{const d=col.d;const b=box(d.id,cx-W/2,y1,d.label,'（既に死亡）','x');tops.push(b.cx);
        const reps=m.P.filter(p=>p.parent===d.id);
        if(reps.length){const rc=[];reps.forEach((p,j)=>{const rb=heirBox(p,x+j*(W+GX)+GX/2,y2);rc.push(rb.cx);});
          const by=b.bot+GY/2;lines.push(`M${b.cx} ${b.bot}V${by}M${Math.min(...rc)} ${by}H${Math.max(...rc)}`);rc.forEach(c=>lines.push(`M${c} ${by}V${y2}`));}}
      x+=cw;});
    couple(x/2-GX/2,0);const mx=coupleMidX();const by=row(1)-GY/2;
    lines.push(`M${mx} ${sp?D.mid+3:D.bot}V${by}M${Math.min(mx,...tops)} ${by}H${Math.max(mx,...tops)}`);tops.forEach(t=>lines.push(`M${t} ${by}V${y1}`));
  }else if(m.rank===2){
    couple(0,row(1));const ps=m.P.filter(p=>p.id[0]==='p');const cx=D.cx;
    const pbs=ps.map((p,i)=>heirBox(p,cx-(ps.length*(W+GX)-GX)/2+i*(W+GX),0));
    const by=pbs[0].bot+GY/2;
    if(pbs.length===2)lines.push(`M${pbs[0].r} ${pbs[0].mid-3}H${pbs[1].l}M${pbs[0].r} ${pbs[0].mid+3}H${pbs[1].l}M${(pbs[0].r+pbs[1].l)/2} ${pbs[0].mid+3}V${by}H${cx}V${D.top}`);
    else lines.push(`M${pbs[0].cx} ${pbs[0].bot}V${by}H${cx}V${D.top}`);
  }else if(m.rank===3){
    const sib=m.P.filter(p=>p.id[0]==='s');
    const cols=[...sib.map(p=>({p,w:1})),...m.dead.map(d=>({d,w:Math.max(1,d.reps)}))];
    let x=0;const y1=row(1),y2=row(2);const tops=[];
    cols.forEach(col=>{const cw=col.w*(W+GX);const cx=x+cw/2;
      if(col.p){tops.push(heirBox(col.p,cx-W/2,y1).cx);}
      else{const d=col.d;const b=box(d.id,cx-W/2,y1,d.label,'（既に死亡）','x');tops.push(b.cx);
        const reps=m.P.filter(p=>p.parent===d.id);
        if(reps.length){const rc=[];reps.forEach((p,j)=>rc.push(heirBox(p,x+j*(W+GX)+GX/2,y2).cx));const by=b.bot+GY/2;
          lines.push(`M${b.cx} ${b.bot}V${by}M${Math.min(...rc)} ${by}H${Math.max(...rc)}`);rc.forEach(c=>lines.push(`M${c} ${by}V${y2}`));}}
      x+=cw;});
    D=box('dec',x+GX/2,y1,'被相続人','（亡くなった方）','d');tops.push(D.cx);
    if(sp){SP=heirBox(sp,D.r+GX,y1);lines.push(`M${D.r} ${D.mid-3}H${SP.l}M${D.r} ${D.mid+3}H${SP.l}`);}
    const pcx=(Math.min(...tops)+Math.max(...tops))/2;const pb=box('pp',pcx-W/2,0,'父母','（既に死亡）','x');
    const by=y1-GY/2;lines.push(`M${pb.cx} ${pb.bot}V${by}M${Math.min(...tops)} ${by}H${Math.max(...tops)}`);tops.forEach(t=>lines.push(`M${t} ${by}V${y1}`));
  }else{
    couple(0,0);
  }
  const minX=Math.min(...nodes.map(n=>n.x))-10,maxX=Math.max(...nodes.map(n=>n.x+W))+10,maxY=Math.max(...nodes.map(n=>n.y+H))+10,minY=-10;
  const vw=maxX-minX,vh=maxY-minY;
  let s=`<svg viewBox="${minX} ${minY} ${vw} ${vh}" width="${vw}" height="${vh}" role="img" aria-label="相続関係図">`;
  s+=`<path class="ln" d="${lines.join('')}"/>`;
  nodes.forEach(n=>{const cls=n.kind==='d'?'n-box n-dec':n.kind==='x'?'n-dead':'n-box';
    const tc=n.kind==='d'?' n-dec-t':n.kind==='x'?' n-dead-t':'';
    s+=`<rect class="${cls}" x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="7"/>`;
    s+=`<text class="n-t${tc}" x="${n.x+W/2}" y="${n.y+20}" text-anchor="middle">${esc(n.title)}</text>`;
    s+=`<text class="n-s${tc}" x="${n.x+W/2}" y="${n.y+37}" text-anchor="middle">${esc(n.sub)}</text>`;});
  return s+'</svg>';
}

function stepCount(path,delta,lim){

const digits=s=>String(s??'').normalize('NFKC').replace(/[^\d]/g,'');
const toNum=s=>{const d=digits(s);return d?Number(d):0;};
function findData(o,depth){if(!o||typeof o!=='object'||depth>5)return null;if(o.assets&&typeof o.assets==='object'&&!Array.isArray(o.assets))return o;
  for(const k of Object.keys(o)){const r=findData(o[k],depth+1);if(r)return r;}return null;}
function isEnc(j){if(!j||typeof j!=='object')return false;if(j.format==='zaisanTool-save-enc')return true;
  if(findData(j,0))return false;const f=encFields(j);return !!(f.ct&&(f.iv||f.salt));}
function parseZaisan(text,fname){
  let j;try{j=JSON.parse(text);}catch(e){return{error:'ファイルを読み込めませんでした。「財産目録作成システム」の「保存」で作成したJSONファイルを選んでください。'};}
  if(isEnc(j))return{enc:true,raw:j,file:fname};
  return parseObj(j,fname);
}
/* パスワード付きファイル（PBKDF2 + AES）の復号。保存形式の違いに備えて代表的な設定を順に試す */
function encFields(o){const out={};const look=(obj,depth)=>{if(!obj||typeof obj!=='object'||depth>2)return;
    for(const [k,v] of Object.entries(obj)){const key=k.toLowerCase();
      if(typeof v==='string'||Array.isArray(v)){
        if(!out.salt&&key==='salt')out.salt=v;
        else if(!out.iv&&(key==='iv'||key==='nonce'))out.iv=v;
        else if(!out.ct&&['ct','data','cipher','ciphertext','payload','enc','body','content','encrypted'].includes(key)&&String(v).length>16)out.ct=v;
        else if(!out.hash&&['hash','digest'].includes(key))out.hash=String(v).toUpperCase().replace(/^SHA(\d)/,'SHA-$1');
      }else if(typeof v==='number'&&!out.iter&&['iter','iters','iterations','iteration','rounds'].includes(key))out.iter=v;
      else if(v&&typeof v==='object'&&!Array.isArray(v))look(v,depth+1);}};
  look(o,0);return out;}
function b64(v){if(Array.isArray(v))return new Uint8Array(v);let t=String(v).trim();
  if(/^[0-9a-f]+$/i.test(t)&&t.length%2===0&&t.length>=24){const u=new Uint8Array(t.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(t.substr(i*2,2),16);return u;}
  t=t.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');while(t.length%4)t+='=';const bin=atob(t);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function decryptZaisan(raw,pw){
  const f=encFields(raw);if(!f.ct)throw new Error('format');
  let ct=b64(f.ct),salt=f.salt?b64(f.salt):null,iv=f.iv?b64(f.iv):null;
  const layouts=[];
  if(salt&&iv)layouts.push({salt,iv,ct});
  else if(salt&&!iv){layouts.push({salt,iv:ct.slice(0,12),ct:ct.slice(12)},{salt,iv:ct.slice(0,16),ct:ct.slice(16)});}
  else if(!salt&&iv){layouts.push({salt:ct.slice(0,16),iv,ct:ct.slice(16)});}
  else{layouts.push({salt:ct.slice(0,16),iv:ct.slice(16,28),ct:ct.slice(28)},{salt:ct.slice(0,16),iv:ct.slice(16,32),ct:ct.slice(32)});}
  const hashes=f.hash?[f.hash]:['SHA-256','SHA-512','SHA-1'];
  const iters=f.iter?[f.iter]:[100000,200000,250000,310000,150000,600000,10000,1000000];
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  for(const L of layouts)for(const hash of hashes)for(const it of iters){
    let bits;try{bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:L.salt,iterations:it,hash},base,256);}catch(e){continue;}
    for(const mode of ['AES-GCM','AES-CBC']){
      if(mode==='AES-CBC'&&L.iv.length!==16)continue;
      try{const key=await crypto.subtle.importKey('raw',bits,mode,false,['decrypt']);
        const plain=await crypto.subtle.decrypt({name:mode,iv:L.iv},key,L.ct);
        const txt=new TextDecoder().decode(plain);const j=JSON.parse(txt);if(j&&typeof j==='object')return j;}catch(e){}
    }}
  throw new Error('password');
}
function parseObj(j,fname){
  const d=findData(j,0);if(!d)return{error:'財産の情報が見つかりませんでした。「財産目録作成システム」で保存したファイルか確認してください。'};
  const sum={},cnt={},notes=[],items={};const add=(k,v,x)=>{if(!v)return;sum[k]=(sum[k]||0)+v;cnt[k]=(cnt[k]||0)+1;(items[k]=items[k]||[]).push({v,acq:x&&x.acq,name:x&&(x.name||x.inst)||''});};
  const as=d.assets, arr=k=>Array.isArray(as[k])?as[k]:[];
  arr('bank').forEach(x=>add('cash',toNum(x.amount),x));
  arr('realestate').forEach(x=>{const isB=/建物|家屋|居宅|bldg|building/i.test(String(x.kind||''));add(isB?'building':'land',toNum(x.amount),x);});
  const condo=arr('condo').filter(x=>toNum(x.amount));if(condo.length){condo.forEach(x=>add('building',toNum(x.amount),x));notes.push('マンション（区分建物）は、敷地権を含めて「建物」に計上しました。');}
  arr('securities').forEach(x=>{let v=toNum(x.deposit);(Array.isArray(x.issues)?x.issues:[]).forEach(i=>v+=toNum(i.amount));if(!v)v=toNum(x.amount);add('securities',v,x);});
  arr('car').forEach(x=>add('household',toNum(x.amount),x));
  arr('other').forEach(x=>{const t=String(x.name||'')+String(x.detail||'');const v=toNum(x.amount);
    if(/生命保険|死亡保険/.test(t)){add('insurance',v,x);if(v)notes.push('その他の財産のうち「'+(x.name||'保険')+'」を生命保険金として計上しました。');}
    else if(/退職/.test(t)){add('retirement',v,x);if(v)notes.push('その他の財産のうち「'+(x.name||'退職金')+'」を死亡退職金として計上しました。');}
    else add('other',v,x);});
  arr('debt').forEach(x=>{const t=String(x.creditor||'')+String(x.debtType||'')+String(x.note||'');add(/葬/.test(t)?'funeral':'debt',toNum(x.amount),x);});
  const dec=d.deceased&&d.deceased.name?String(d.deceased.name):'';
  const fileHeirs=(Array.isArray(d.heirs)?d.heirs:[]).filter(h=>h&&h.id).map(h=>({id:String(h.id),name:String(h.name||''),note:String(h.note||'')}));
  const hasAcq=Object.values(items).some(list=>list.some(it=>acqParts(it.acq).length));
  const map={};if(hasAcq){const used=new Set();fileHeirs.forEach(fh=>{const g=guessHeir(fh,used);if(g){map[fh.id]=g;used.add(g);}else map[fh.id]='';});}
  return{file:fname,sum,cnt,notes,deceased:dec,items,fileHeirs,hasAcq,map,useAcq:hasAcq};
}
/* 財産目録の取得者情報（acq）を [{hid, f(割合)}] に変換 */
function acqParts(acq){
  if(!acq||!Array.isArray(acq.list)||!acq.mode||acq.mode==='none')return [];
  const list=acq.list.filter(x=>x&&x.hid);if(!list.length)return [];
  if(acq.mode==='single')return [{hid:String(list[0].hid),f:1}];
  if(acq.equal)return list.map(x=>({hid:String(x.hid),f:1/list.length}));
  const parts=list.map(x=>{const n=toNum(x.num),d=toNum(x.den);return{hid:String(x.hid),f:d>0?n/d:0};});
  return parts.some(x=>x.f>0)?parts:list.map(x=>({hid:String(x.hid),f:1/list.length}));
}
function guessHeir(fh,used){
  const P=model(false).P;const free=P.filter(p=>!used.has(p.id));
  const byName=free.find(p=>(S.names[p.id]||'').replace(/[\s　]/g,'')&&(S.names[p.id]||'').replace(/[\s　]/g,'')===fh.name.replace(/[\s　]/g,''));if(byName)return byName.id;
  const t=fh.note+' '+fh.name;
  const pick=re=>{const p=free.find(p=>re.test(p.id));return p?p.id:'';};
  if(/妻|夫|配偶/.test(t))return pick(/^sp$/);
  if(/孫/.test(t))return pick(/^g/);
  if(/甥|姪/.test(t))return pick(/^n/);
  if(/長男|長女|次男|次女|三男|三女|四男|四女|子|息子|娘|養子/.test(t))return pick(/^[ca]/)||pick(/^g/);
  if(/父/.test(t))return pick(/^p0$/)||pick(/^p/);
  if(/母/.test(t))return pick(/^p1$/)||pick(/^p/);
  if(/兄|弟|姉|妹/.test(t))return pick(/^s/);
  return '';
}
function importInsRows(p){const P=model(false).P;const out=[];

    else out.push({co:it.name||'',to:'',amount:it.v});});

function importRatios(p){
  const P=model(false).P;const r={};
  Object.keys(p.items).filter(k=>k!=='insurance').forEach(k=>{
    const tot=p.items[k].reduce((s,it)=>s+it.v,0);if(!tot)return;const acc={};P.forEach(x=>acc[x.id]=0);
    p.items[k].forEach(it=>{const parts=acqParts(it.acq);
      if(!parts.length){P.forEach(x=>acc[x.id]+=it.v*x.n/x.d);return;}
      const fs=parts.reduce((s,x)=>s+x.f,0)||1;
      parts.forEach(x=>{const hid=p.map[x.hid];if(hid&&acc[hid]!=null)acc[hid]+=it.v*x.f/fs;});});

  });
  return r;
}

async function doPrint(){
  const msg=document.getElementById('printMsg');
  const show=(t,cls)=>{msg.hidden=false;msg.className='note noprint'+(cls?' '+cls:'');msg.textContent=t;};
  if(window.self===window.top){window.print();return;}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(!dl){show('この画面からは印刷できません。お使いのブラウザで、このページを新しいタブで開いてからお試しください。','warn');return;}
  show('印刷用ファイルを準備しています…');
  try{await dl.save({filename:(S.family||'')+'家_相続税シミュレーション.html',data:printableDoc()});
    show('印刷用ファイルを保存しました。保存したファイルを開くと、印刷画面が自動で表示されます。','ok');}
  catch(e){const c=e&&e.code;
    if(c==='declined')show('保存を取りやめました。もう一度「印刷する」を押すと保存できます。');
    else if(c==='rate_limited')show('保存の確認画面が開いています。確認画面で「保存」を選んでください。');
    else show('印刷用ファイルを保存できませんでした。お使いのブラウザで、このページを新しいタブで開いてからお試しください。','warn');}
}
